@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141c;--card:#1b1f2c;--tx:#eceff8;--mu:#99a1bd;--ac:#6f93ff;--bd:#2c3246;--me:#27407f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Ethiopic","Noto Sans SC",sans-serif}
.w{max-width:900px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
h1,h2,h3{margin:.3em 0}.mu{color:var(--mu);font-size:.88rem}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--no)}button.s{padding:4px 10px;font-size:.85rem}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto;min-width:0}
.big{text-align:center;padding:40px 16px}.big button{width:100%;margin:8px 0;padding:18px;font-size:1.1rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 0}.cal button.on{background:var(--ac);color:#fff}.cal button.has{border-color:var(--ok);border-width:2px}
.code{font-size:2.4rem;letter-spacing:.3em;text-align:center;font-weight:700;color:var(--ac)}
.item{border-top:1px solid var(--bd);padding:12px 0;display:flex;justify-content:space-between;gap:8px}.item:first-child{border:0}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:1px 10px;font-size:.8rem;margin-right:6px}.err{color:var(--no)}.ok{color:var(--ok)}
.media{max-width:100%;max-height:320px;border-radius:12px;margin-top:6px;display:block}
.chat{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--bd);align-self:flex-start;word-break:break-word}.b.me{align-self:flex-end;background:var(--me)}
.b small{display:block;color:var(--mu);font-size:.75rem}.b b{color:var(--ac);font-size:.85rem}.emo{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0}.emo span{cursor:pointer;font-size:1.5rem}
.lang{display:flex;gap:6px;justify-content:flex-end}.lang button{padding:3px 10px;font-size:.8rem}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}.stat b{font-size:1.6rem;display:block;color:var(--ac)}
.due{color:var(--no);font-weight:600}
</style></head><body><div class="w" id="app"></div>
